    <script>
        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

        function getISOWeek(date) {
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNum = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            return { week: weekNum, year: d.getUTCFullYear() };
        }

        function getWeekStartEnd(date) {
            const d = new Date(date);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1);
            const monday = new Date(d.setDate(diff));
            const sunday = new Date(monday);
            sunday.setDate(sunday.getDate() + 6);
            return { start: monday, end: sunday };
        }

        function calculateWeek() {
            const dateInput = document.getElementById('dateInput').value;
            if (!dateInput) {
                showError('Please select a date');
                return;
            }

            try {
                const date = new Date(dateInput + 'T00:00:00');
                const isoWeek = getISOWeek(date);
                const weekRange = getWeekStartEnd(date);
                const dayOfWeek = DAYS[date.getDay()];
                const daysUntilWeekend = 6 - date.getDay();

                displayResults(date, isoWeek, weekRange, dayOfWeek, daysUntilWeekend);
            } catch (e) {
                showError('Error calculating week');
            }
        }

        function displayResults(date, isoWeek, weekRange, dayOfWeek, daysUntilWeekend) {
            const formatDate = (d) => {
                return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
            };

            const formatDateShort = (d) => {
                return `${String(d.getMonth() + 1).padStart(2, '0')}/${String(d.getDate()).padStart(2, '0')}/${d.getFullYear()}`;
            };

            // Update current week highlight
            document.getElementById('currentWeekNum').textContent = `W${String(isoWeek.week).padStart(2, '0')}`;
            document.getElementById('currentWeekLabel').textContent = `${formatDate(date)} • ${dayOfWeek}`;

            // Generate week calendar
            let weekCalendarHTML = '<div class="week-calendar"><div class="week-calendar-title">Week Overview</div><div class="week-days">';
            const weekStart = weekRange.start;
            for (let i = 0; i < 7; i++) {
                const dayDate = new Date(weekStart);
                dayDate.setDate(dayDate.getDate() + i);
                const isCurrentDay = dayDate.toDateString() === date.toDateString();
                const dayName = DAYS[dayDate.getDay()];

                weekCalendarHTML += `
                    <div class="day-card ${isCurrentDay ? 'current' : ''}">
                        <div class="day-name">${dayName.substring(0, 3)}</div>
                        <div class="day-date">${dayDate.getDate()}</div>
                        <div class="day-num">${dayName === 'Monday' ? '1' : dayName === 'Tuesday' ? '2' : dayName === 'Wednesday' ? '3' : dayName === 'Thursday' ? '4' : dayName === 'Friday' ? '5' : dayName === 'Saturday' ? '6' : '7'}</div>
                    </div>
                `;
            }
            weekCalendarHTML += '</div></div>';

            const section = document.getElementById('resultsSection');
            section.innerHTML = `
                <div class="results-grid">
                    <div class="result-card">
                        <div class="result-label">ISO Week Number</div>
                        <div class="result-value">W${String(isoWeek.week).padStart(2, '0')}</div>
                        <div class="result-unit">Week ${isoWeek.week} of ${isoWeek.year}</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Week Year</div>
                        <div class="result-value">${isoWeek.year}</div>
                        <div class="result-unit">ISO Week Year</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Day of Week</div>
                        <div class="result-value">${dayOfWeek}</div>
                        <div class="result-unit">(Day ${date.getDay() === 0 ? 7 : date.getDay()})</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Days to Weekend</div>
                        <div class="result-value">${daysUntilWeekend}</div>
                        <div class="result-unit">${daysUntilWeekend === 1 ? 'day' : 'days'}</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Week Start</div>
                        <div class="result-value">${formatDateShort(weekRange.start)}</div>
                        <div class="result-unit">Monday</div>
                    </div>
                    <div class="result-card">
                        <div class="result-label">Week End</div>
                        <div class="result-value">${formatDateShort(weekRange.end)}</div>
                        <div class="result-unit">Sunday</div>
                    </div>
                </div>
                ${weekCalendarHTML}
            `;
            section.style.display = 'block';
        }

        function useToday() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('dateInput').value = `${year}-${month}-${day}`;
            calculateWeek();
        }

        function clearResults() {
            document.getElementById('dateInput').value = '';
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('currentWeekNum').textContent = '--';
            document.getElementById('currentWeekLabel').textContent = 'Select a date to see week details';
        }

        function showError(message) {
            const section = document.getElementById('resultsSection');
            section.innerHTML = `<div class="error">${message}</div>`;
            section.style.display = 'block';
        }

        // Initialize with today's date
        window.addEventListener('load', () => {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('dateInput').value = `${year}-${month}-${day}`;
        });
    </script>
