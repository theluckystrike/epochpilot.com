<body>
<div class="container">
  <header>
    <h1>💤 Sleep Cycle Calculator <span>epochpilot</span></h1>
    <div class="subhead">Wake refreshed — optimal times based on 90-min cycles</div>
  </header>

  <div class="mode-tabs">
    <button class="mode-btn active" data-mode="1">🌙 Mode 1: Bedtime → Wake</button>
    <button class="mode-btn" data-mode="2">⏰ Mode 2: Wake → Bedtime</button>
    <button class="mode-btn" data-mode="3">⚡ Mode 3: Sleep now</button>
  </div>

  <div class="calc-card" id="calcCard">
    <div id="inputArea"></div>
    <div id="resultsArea"></div>

      <canvas id="sleepCanvas" width="800" height="120"></canvas>

      <li>Consistent schedule</li>

<script>
  (function() {
    // ----- state -----
    let currentMode = 1;   // 1,2,3
    const canvas = document.getElementById('sleepCanvas');
    const ctx = canvas.getContext('2d');

    // DOM refs
    const inputArea = document.getElementById('inputArea');
    const resultsArea = document.getElementById('resultsArea');

    // helpers
    function pad2(n) { return n.toString().padStart(2, '0'); }

    function formatTimeHHMM(date) {
      return `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
    }

    // add minutes to date
    function addMinutes(date, mins) {
      const d = new Date(date);
      d.setMinutes(d.getMinutes() + mins);
      return d;
    }

    // generate wake times from bedtime (mode 1)
    function computeWakeFromBed(bedDate) {
      const onset = 15; // min
      const cycleMin = 90;
      const results = [];
      for (let cycles = 4; cycles <= 6; cycles++) {
        const totalSleep = cycles * cycleMin; // min
        const wakeDate = addMinutes(bedDate, onset + totalSleep);
        const durationHours = (totalSleep / 60).toFixed(1);
        let quality = '';
        if (cycles === 4) quality = 'fair';
        else if (cycles === 5) quality = 'good';
        else if (cycles === 6) quality = 'ideal';
        results.push({
          cycles,
          wakeDate,
          durationHours: parseFloat(durationHours),
          quality
        });
      }
      return results;
    }

    // mode 2: from wake time -> bedtimes
    function computeBedFromWake(wakeDate) {
      const onset = 15;
      const cycleMin = 90;
      const results = [];
      for (let cycles = 4; cycles <= 6; cycles++) {
        const totalSleep = cycles * cycleMin;
        const bedDate = addMinutes(wakeDate, - (onset + totalSleep));
        const durationHours = (totalSleep / 60).toFixed(1);
        let quality = '';
        if (cycles === 4) quality = 'fair';
        else if (cycles === 5) quality = 'good';
        else if (cycles === 6) quality = 'ideal';
        results.push({
          cycles,
          bedDate,
          durationHours: parseFloat(durationHours),
          quality
        });
      }
      return results;
    }

    // mode 3: now -> wake times
    function computeWakeFromNow() {
      const now = new Date();
      const onset = 15;
      const cycleMin = 90;
      const results = [];
      for (let cycles = 4; cycles <= 6; cycles++) {
        const totalSleep = cycles * cycleMin;
        const wakeDate = addMinutes(now, onset + totalSleep);
        const durationHours = (totalSleep / 60).toFixed(1);
        let quality = '';
        if (cycles === 4) quality = 'fair';
        else if (cycles === 5) quality = 'good';
        else if (cycles === 6) quality = 'ideal';
        results.push({
          cycles,
          wakeDate,
          durationHours: parseFloat(durationHours),
          quality
        });
      }
      return results;
    }

    // draw timeline (simplified sleep stages)
    function drawTimeline(cycleCount = 5, totalDurationMin = 450) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const w = canvas.width, h = canvas.height;
      const yCenter = h/2;
      const startX = 40, endX = w - 20;
      const totalWidth = endX - startX;
      if (totalWidth <= 0) return;

      // background
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, w, h);

      // draw cycles as repeating pattern light->deep->REM
      const cycleCountDraw = cycleCount || 5;
      const cycles = Math.min(cycleCountDraw, 6);
      const cycleWidth = totalWidth / cycles;

      for (let i = 0; i < cycles; i++) {
        const x0 = startX + i * cycleWidth;
        // light sleep (0-40% of cycle)
        const lightEnd = x0 + cycleWidth * 0.4;
        // deep sleep (40-70%)
        const deepEnd = x0 + cycleWidth * 0.7;
        // REM (70-100%)
        const remEnd = x0 + cycleWidth;

        // light
        ctx.fillStyle = '#7dd3fc';
        ctx.fillRect(x0, yCenter-8, lightEnd - x0, 16);
        // deep
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(lightEnd, yCenter-8, deepEnd - lightEnd, 16);
        // REM
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(deepEnd, yCenter-8, remEnd - deepEnd, 16);
      }

      // labels
      ctx.fillStyle = '#94a3b8';
      ctx.font = '11px system-ui, sans-serif';
      ctx.fillText('🌙 Light', 10, yCenter-12);
      ctx.fillText('💤 Deep', 10, yCenter+20);
      ctx.fillText('🧠 REM', 10, yCenter+4);
      // cycle markers
      for (let i = 0; i <= cycles; i++) {
        const x = startX + i * cycleWidth;
        ctx.beginPath();
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.moveTo(x, yCenter-14);
        ctx.lineTo(x, yCenter+14);
        ctx.stroke();
        if (i < cycles) {
          ctx.fillStyle = '#64748b';
          ctx.font = '9px sans-serif';
          ctx.fillText(`C${i+1}`, x+4, yCenter+26);
        }
      }
    }

    // render results & timeline
    function renderResults(mode, results) {
      resultsArea.innerHTML = '';
      if (!results || results.length === 0) {
        resultsArea.innerHTML = '<p style="color:#94a3b8;">No results. Enter a valid time.</p>';
        drawTimeline(5, 450);
        return;
      }

      const container = document.createElement('div');
      container.className = 'results-grid';

      let cycleForTimeline = 5;
      let durationForTimeline = 450;

      results.forEach((r, idx) => {
        const item = document.createElement('div');
        item.className = 'result-item';

        const leftDiv = document.createElement('div');
        leftDiv.className = 'inline-flex';
        leftDiv.innerHTML = `<span class="cycles">${r.cycles} cycles</span> <span class="duration">${r.durationHours}h</span>`;

        const timeStr = mode === 2 ? formatTimeHHMM(r.bedDate) : formatTimeHHMM(r.wakeDate);
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = timeStr;

        const qualitySpan = document.createElement('span');
        qualitySpan.className = 'quality';
        qualitySpan.textContent = r.quality;

        item.appendChild(leftDiv);
        item.appendChild(timeSpan);
        item.appendChild(qualitySpan);
        container.appendChild(item);

        // use middle result for timeline
        if (idx === 1) {
          cycleForTimeline = r.cycles;
          durationForTimeline = r.durationHours * 60;
        }
      });

      resultsArea.appendChild(container);

      // draw timeline based on middle result
      drawTimeline(cycleForTimeline, durationForTimeline);
    }

    // ----- input builders -----
    function buildMode1() {
      const now = new Date();
      const defaultTime = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      inputArea.innerHTML = `
        <div class="input-group">
          <div class="input-row">
            <label for="bedtimeInput">🌙 Bedtime</label>
            <input type="time" id="bedtimeInput" value="${defaultTime}">
          </div>
          <button class="action-btn" id="calcBtn1">Calculate wake times</button>
        </div>
      `;
      document.getElementById('calcBtn1').addEventListener('click', function() {
        const val = document.getElementById('bedtimeInput').value;
        if (!val) return;
        const [h, m] = val.split(':').map(Number);
        const bedDate = new Date();
        bedDate.setHours(h, m, 0, 0);
        const results = computeWakeFromBed(bedDate);
        renderResults(1, results);
      });
      // trigger default
      setTimeout(() => {
        const def = document.getElementById('bedtimeInput');
        if (def) {
          def.value = defaultTime;
          def.dispatchEvent(new Event('change'));
          document.getElementById('calcBtn1')?.click();
        }
      }, 50);
    }

    function buildMode2() {
      const now = new Date();
      const defaultTime = `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      inputArea.innerHTML = `
        <div class="input-group">
          <div class="input-row">
            <label for="wakeInput">⏰ Wake time</label>
            <input type="time" id="wakeInput" value="${defaultTime}">
          </div>
          <button class="action-btn" id="calcBtn2">Calculate bedtimes</button>
        </div>
      `;
      document.getElementById('calcBtn2').addEventListener('click', function() {
        const val = document.getElementById('wakeInput').value;
        if (!val) return;
        const [h, m] = val.split(':').map(Number);
        const wakeDate = new Date();
        wakeDate.setHours(h, m, 0, 0);
        const results = computeBedFromWake(wakeDate);
        renderResults(2, results);
      });
      setTimeout(() => {
        const def = document.getElementById('wakeInput');
        if (def) {
          def.value = defaultTime;
          document.getElementById('calcBtn2')?.click();
        }
      }, 50);
    }

    function buildMode3() {
      inputArea.innerHTML = `
        <div class="input-group">
          <div style="color:#94a3b8; padding:0.2rem 0;">🕒 Using current time: <strong id="currentTimeDisplay"></strong></div>
          <button class="action-btn" id="calcBtn3">Show optimal wake times</button>
        </div>
      `;
      function updateNow() {
        const now = new Date();
        document.getElementById('currentTimeDisplay').textContent = 
          `${pad2(now.getHours())}:${pad2(now.getMinutes())}`;
      }
      updateNow();
      document.getElementById('calcBtn3').addEventListener('click', function() {
        const results = computeWakeFromNow();
        renderResults(1, results); // mode 1 style (wake times)
      });
      // auto click
      setTimeout(() => {
        document.getElementById('calcBtn3')?.click();
      }, 60);
    }

    // switch mode
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', parseInt(btn.dataset.mode) === mode);
      });
      if (mode === 1) buildMode1();
      else if (mode === 2) buildMode2();
      else if (mode === 3) buildMode3();
    }

    // attach mode buttons
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const mode = parseInt(this.dataset.mode);
        setMode(mode);
      });
    });

    // init mode 1
    setMode(1);
  })();
</script>
