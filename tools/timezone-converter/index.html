<body>
    <div class="container">
        <h1>Time Zone Converter</h1>
        <p class="subtitle">Convert times across zones with DST awareness</p>

        <div class="converter-grid">
            <div class="section">
                <div class="form-group">
                    <label for="sourceDateTime">Date & Time</label>
                    <input type="datetime-local" id="sourceDateTime">
                </div>

                <div class="form-group">
                    <label for="sourceTimezone">Source Timezone</label>
                    <select id="sourceTimezone">
                        <option value="UTC">UTC (GMT+0)</option>
                        <option value="US/Eastern">US Eastern (EST/EDT)</option>
                        <option value="US/Central">US Central (CST/CDT)</option>
                        <option value="US/Mountain">US Mountain (MST/MDT)</option>
                        <option value="US/Pacific">US Pacific (PST/PDT)</option>
                        <option value="Europe/London">London (GMT/BST)</option>
                        <option value="Europe/Paris">Paris (CET/CEST)</option>
                        <option value="Europe/Berlin">Berlin (CET/CEST)</option>
                        <option value="Asia/Tokyo">Tokyo (JST)</option>
                        <option value="Asia/Shanghai">Shanghai (CST)</option>
                        <option value="Asia/Hong_Kong">Hong Kong (HKT)</option>
                        <option value="Asia/Singapore">Singapore (SGT)</option>
                        <option value="Asia/Kolkata">India (IST)</option>
                        <option value="Australia/Sydney">Sydney (AEDT/AEST)</option>
                        <option value="Australia/Melbourne">Melbourne (AEDT/AEST)</option>
                        <option value="Asia/Dubai">Dubai (GST)</option>
                        <option value="America/Toronto">Toronto (EST/EDT)</option>
                        <option value="America/Vancouver">Vancouver (PST/PDT)</option>
                        <option value="America/Mexico_City">Mexico City (CST/CDT)</option>
                        <option value="America/Sao_Paulo">São Paulo (BRT/BRST)</option>
                        <option value="Europe/Moscow">Moscow (MSK)</option>
                        <option value="Asia/Bangkok">Bangkok (ICT)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Target Timezones</label>
                    <div class="timezone-selector" id="tzSelector">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <button class="button" onclick="convertTime()">Convert</button>

                <div class="quick-links">
                    <button class="quick-link" onclick="setNow()">Now</button>
                    <button class="quick-link" onclick="setNoon()">Noon UTC</button>
                    <button class="quick-link" onclick="setMidnight()">Midnight</button>
                </div>
            </div>

            <div class="section">
                <h3 style="margin-bottom: 20px; color: #3b82f6;">Converted Times</h3>
                <div class="selected-zones" id="selectedZones">
                    <p style="color: #666; text-align: center; padding: 20px;">Select timezones and convert</p>
                </div>
            </div>
        </div>

        <div class="world-clock">
            <h3 style="color: #3b82f6; margin-bottom: 15px;">World Clock (Live)</h3>
            <div class="clock-grid" id="worldClock">
                <!-- Populated by JS -->
            </div>
        </div>
    </div>

        © 2026 epochpilot.com
    </div>

    <script>
        const timezones = [
            { name: 'UTC', offset: 0 },
            { name: 'US/Eastern', offset: -5 },
            { name: 'US/Central', offset: -6 },
            { name: 'US/Mountain', offset: -7 },
            { name: 'US/Pacific', offset: -8 },
            { name: 'Europe/London', offset: 0 },
            { name: 'Europe/Paris', offset: 1 },
            { name: 'Europe/Berlin', offset: 1 },
            { name: 'Asia/Tokyo', offset: 9 },
            { name: 'Asia/Shanghai', offset: 8 },
            { name: 'Asia/Hong_Kong', offset: 8 },
            { name: 'Asia/Singapore', offset: 8 },
            { name: 'Asia/Kolkata', offset: 5.5 },
            { name: 'Australia/Sydney', offset: 11 },
            { name: 'Australia/Melbourne', offset: 11 },
            { name: 'Asia/Dubai', offset: 4 },
            { name: 'America/Toronto', offset: -5 },
            { name: 'America/Vancouver', offset: -8 },
            { name: 'America/Mexico_City', offset: -6 },
            { name: 'America/Sao_Paulo', offset: -3 },
            { name: 'Europe/Moscow', offset: 3 },
            { name: 'Asia/Bangkok', offset: 7 }
        ];

        const majorCities = [
            { name: 'New York', tz: 'US/Eastern' },
            { name: 'London', tz: 'Europe/London' },
            { name: 'Paris', tz: 'Europe/Paris' },
            { name: 'Tokyo', tz: 'Asia/Tokyo' },
            { name: 'Dubai', tz: 'Asia/Dubai' },
            { name: 'Sydney', tz: 'Australia/Sydney' },
            { name: 'Singapore', tz: 'Asia/Singapore' },
            { name: 'São Paulo', tz: 'America/Sao_Paulo' }
        ];

        function initTimezoneSelector() {
            const selector = document.getElementById('tzSelector');
            timezones.forEach(tz => {
                const label = document.createElement('label');
                label.className = 'timezone-option';
                label.innerHTML = `
                    <input type="checkbox" class="tz-checkbox" value="${tz.name}">
                    <span>${tz.name}</span>
                `;
                selector.appendChild(label);
            });
        }

        function getOffsetString(offset) {
            if (offset === 0) return 'UTC±0';
            const sign = offset > 0 ? '+' : '';
            return `UTC${sign}${offset}`;
        }

        function convertTime() {
            const dateTimeStr = document.getElementById('sourceDateTime').value;
            if (!dateTimeStr) return;

            const [dateStr, timeStr] = dateTimeStr.split('T');
            const sourceDate = new Date(dateStr + 'T' + timeStr + ':00Z');

            const selectedCheckboxes = document.querySelectorAll('.tz-checkbox:checked');
            let results = '';

            selectedCheckboxes.forEach(cb => {
                const tzName = cb.value;
                const tzObj = timezones.find(t => t.name === tzName);
                if (!tzObj) return;

                const offset = tzObj.offset;
                const convertedDate = new Date(sourceDate.getTime() + offset * 60 * 60 * 1000);

                const time = convertedDate.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                const date = convertedDate.toLocaleDateString('en-US', {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });

                results += `
                    <div class="zone-result">
                        <div class="zone-name">${tzName}</div>
                        <div class="zone-time">${time}</div>
                        <div class="zone-offset">${date} • ${getOffsetString(offset)}</div>
                    </div>
                `;
            });

            document.getElementById('selectedZones').innerHTML = results || '<p style="color: #666; text-align: center; padding: 20px;">No timezones selected</p>';
        }

        function setNow() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const timeStr = now.toTimeString().slice(0, 5);
            document.getElementById('sourceDateTime').value = `${dateStr}T${timeStr}`;
        }

        function setNoon() {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            document.getElementById('sourceDateTime').value = `${dateStr}T12:00`;
        }

        function setMidnight() {
            const today = new Date();
            const dateStr = today.toISOString().split('T')[0];
            document.getElementById('sourceDateTime').value = `${dateStr}T00:00`;
        }

        function updateWorldClock() {
            const now = new Date();
            const clockDiv = document.getElementById('worldClock');

            clockDiv.innerHTML = majorCities.map(city => {
                const tz = timezones.find(t => t.name === city.tz);
                if (!tz) return '';

                const offset = tz.offset;
                const cityDate = new Date(now.getTime() + offset * 60 * 60 * 1000);
                const time = cityDate.toLocaleTimeString('en-US', {
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                });

                return `
                    <div class="city-clock">
                        <div class="city-name">${city.name}</div>
                        <div class="city-time">${time}</div>
                    </div>
                `;
            }).join('');
        }

        // Initialize
        initTimezoneSelector();
        setNow();
        updateWorldClock();

        // Update world clock every second
        setInterval(updateWorldClock, 1000);
    </script>
