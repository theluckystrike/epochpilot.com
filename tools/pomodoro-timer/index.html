<body>
<div class="container">
  <h1>🍅 Pomodoro Timer</h1>
  <div class="subhead">Focus & break with stats</div>

  <!-- phase label -->
  <div style="text-align: center;"><span id="phaseLabel" class="phase-label phase-work">Work</span></div>

  <!-- canvas + time -->
  <div class="timer-canvas-wrapper">
    <canvas id="timerCanvas" width="240" height="240"></canvas>
  </div>
  <div class="time-display" id="timeDisplay">25:00</div>
  <div class="session-count" id="sessionCount">Pomodoro #0</div>

  <!-- controls -->
  <div class="controls">
    <button class="btn btn-primary" id="startPauseBtn">▶ Start</button>
    <button class="btn btn-outline" id="resetBtn">↺ Reset</button>
  </div>
  <div class="keyhint">Space = start/pause · R = reset</div>

  <!-- settings -->
  <div class="settings">
    <div class="setting-item">
      <label>Work (min)</label>
      <input type="number" id="workDuration" min="15" max="60" value="25" step="1">
    </div>
    <div class="setting-item">
      <label>Short break</label>
      <input type="number" id="shortBreak" min="3" max="10" value="5" step="1">
    </div>
    <div class="setting-item">
      <label>Long break</label>
      <input type="number" id="longBreak" min="10" max="30" value="15" step="1">
    </div>
    <div class="setting-item">
      <label>Pomodoros / long</label>
      <input type="number" id="longAfter" min="2" max="10" value="4" step="1">
    </div>
  </div>

  <!-- stats -->
  <div class="stats">
    <div class="stat-item"><div class="stat-value" id="statFocus">0</div><div class="stat-label">Focus min</div></div>
    <div class="stat-item"><div class="stat-value" id="statPomodoros">0</div><div class="stat-label">Pomodoros</div></div>
    <div class="stat-item"><div class="stat-value" id="statBreaks">0</div><div class="stat-label">Breaks</div></div>
  </div>

  <div class="footer">© 2025 epochpilot.com</div>
</div>

<script>
  (function() {
    // ----- DOM refs -----
    const canvas = document.getElementById('timerCanvas');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('timeDisplay');
    const phaseLabel = document.getElementById('phaseLabel');
    const sessionCount = document.getElementById('sessionCount');
    const startPauseBtn = document.getElementById('startPauseBtn');
    const resetBtn = document.getElementById('resetBtn');

    const workInput = document.getElementById('workDuration');
    const shortInput = document.getElementById('shortBreak');
    const longInput = document.getElementById('longBreak');
    const longAfterInput = document.getElementById('longAfter');

    const statFocus = document.getElementById('statFocus');
    const statPomodoros = document.getElementById('statPomodoros');
    const statBreaks = document.getElementById('statBreaks');

    // ----- State -----
    let phase = 'work'; // 'work' | 'short' | 'long'
    let timeLeft = 25 * 60; // seconds
    let totalTime = 25 * 60;
    let isRunning = false;
    let timerInterval = null;

    // stats (current session, persisted)
    let stats = {
      focusSeconds: 0,   // total focus seconds in session
      pomodoros: 0,
      breaks: 0
    };

    // counters
    let pomodorosUntilLong = 4; // from input
    let pomodoroCount = 0;      // how many work cycles completed in this session

    // ----- Load stats from localStorage -----
    function loadStats() {
      try {
        const saved = localStorage.getItem('epochpilot_pomodoro_stats');
        if (saved) {
          const parsed = JSON.parse(saved);
          if (parsed && typeof parsed.focusSeconds === 'number') {
            stats = parsed;
          }
        }
      } catch (e) { /* ignore */ }
    }
    function saveStats() {
      localStorage.setItem('epochpilot_pomodoro_stats', JSON.stringify(stats));
    }

    // ----- helpers -----
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function getPhaseDuration() {
      const w = parseInt(workInput.value, 10) || 25;
      const s = parseInt(shortInput.value, 10) || 5;
      const l = parseInt(longInput.value, 10) || 15;
      if (phase === 'work') return Math.min(60, Math.max(15, w)) * 60;
      if (phase === 'short') return Math.min(10, Math.max(3, s)) * 60;
      return Math.min(30, Math.max(10, l)) * 60;
    }

    function updateUI() {
      // time
      timeDisplay.textContent = formatTime(timeLeft);
      // phase label
      phaseLabel.textContent = phase === 'work' ? 'Work' : (phase === 'short' ? 'Short Break' : 'Long Break');
      phaseLabel.className = 'phase-label ' + (phase === 'work' ? 'phase-work' : phase === 'short' ? 'phase-short' : 'phase-long');
      // session count
      sessionCount.textContent = `Pomodoro #${pomodoroCount}`;
      // stats
      statFocus.textContent = Math.floor(stats.focusSeconds / 60);
      statPomodoros.textContent = stats.pomodoros;
      statBreaks.textContent = stats.breaks;
      // draw canvas
      drawCanvas();
    }

    // ----- Canvas drawing (circular progress) -----
    function drawCanvas() {
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);

      const centerX = w/2, centerY = h/2;
      const radius = 100;
      const lineWidth = 12;

      // background circle
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = lineWidth;
      ctx.stroke();

      // progress arc
      const progress = totalTime > 0 ? (totalTime - timeLeft) / totalTime : 0;
      const startAngle = -Math.PI / 2;
      const endAngle = startAngle + (2 * Math.PI * progress);

      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, startAngle, endAngle);
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.stroke();

      // inner dot
      ctx.beginPath();
      ctx.arc(centerX, centerY, 6, 0, 2 * Math.PI);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
    }

    // ----- Audio notification (Web Audio API) -----
    function playBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.3);
      } catch (e) { /* silent fail */ }
    }

    // ----- Phase transition -----
    function switchPhase(newPhase) {
      phase = newPhase;
      totalTime = getPhaseDuration();
      timeLeft = totalTime;
      isRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      startPauseBtn.textContent = '▶ Start';
      updateUI();
      drawCanvas();
    }

    // ----- Timer tick -----
    function tick() {
      if (!isRunning) return;
      if (timeLeft <= 0) {
        // phase ended
        isRunning = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        startPauseBtn.textContent = '▶ Start';
        playBeep();

        // update stats & counters
        if (phase === 'work') {
          stats.pomodoros += 1;
          pomodoroCount += 1;
          // add focus time (duration of work phase)
          const workSec = getPhaseDuration(); // work duration in seconds
          stats.focusSeconds += workSec;
          // decide next phase
          const longAfter = parseInt(longAfterInput.value, 10) || 4;
          if (pomodoroCount % longAfter === 0) {
            switchPhase('long');
          } else {
            switchPhase('short');
          }
          stats.breaks += 1; // count break (will be taken)
        } else {
          // break ended -> go to work
          stats.breaks += 1; // count break taken
          switchPhase('work');
        }
        saveStats();
        updateUI();
        return;
      }

      timeLeft -= 1;
      // track focus seconds (only when work phase)
      if (phase === 'work') {
        stats.focusSeconds += 1;
      }
      updateUI();
      // save stats periodically (every 5 sec)
      if (stats.focusSeconds % 5 === 0) saveStats();
    }

    // ----- Start / Pause -----
    function toggleStartPause() {
      if (isRunning) {
        // pause
        isRunning = false;
        if (timerInterval) {
          clearInterval(timerInterval);
          timerInterval = null;
        }
        startPauseBtn.textContent = '▶ Start';
      } else {
        // start
        isRunning = true;
        startPauseBtn.textContent = '⏸ Pause';
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(tick, 1000);
        // ensure audio context unlocks on user gesture
        try {
          const dummy = new (window.AudioContext || window.webkitAudioContext)();
          dummy.close();
        } catch(e) {}
      }
    }

    // ----- Reset -----
    function resetTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      isRunning = false;
      // reset to work phase, keep durations from inputs
      phase = 'work';
      totalTime = getPhaseDuration();
      timeLeft = totalTime;
      pomodoroCount = 0;
      // reset stats (session) but keep persisted? we reset session stats to zero but keep localStorage as new session
      stats = { focusSeconds: 0, pomodoros: 0, breaks: 0 };
      saveStats();
      startPauseBtn.textContent = '▶ Start';
      updateUI();
    }

    // ----- Re-read durations (when input changes) -----
    function reapplyDurations() {
      if (!isRunning) {
        // only reset if not running, to avoid disruption
        const oldPhase = phase;
        totalTime = getPhaseDuration();
        if (timeLeft > totalTime) timeLeft = totalTime;
        updateUI();
      }
    }

    // ----- Keyboard shortcuts -----
    function handleKey(e) {
      if (e.key === ' ' || e.code === 'Space') {
        e.preventDefault();
        toggleStartPause();
      } else if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        resetTimer();
      }
    }

    // ----- Init -----
    function init() {
      loadStats();
      // set initial durations
      const w = parseInt(workInput.value, 10) || 25;
      const s = parseInt(shortInput.value, 10) || 5;
      const l = parseInt(longInput.value, 10) || 15;
      phase = 'work';
      totalTime = Math.min(60, Math.max(15, w)) * 60;
      timeLeft = totalTime;
      pomodoroCount = 0;
      pomodorosUntilLong = parseInt(longAfterInput.value, 10) || 4;
      updateUI();

      // event listeners
      startPauseBtn.addEventListener('click', toggleStartPause);
      resetBtn.addEventListener('click', resetTimer);
      document.addEventListener('keydown', handleKey);

      // input changes: reapply durations only if not running
      [workInput, shortInput, longInput, longAfterInput].forEach(inp => {
        inp.addEventListener('change', function() {
          if (!isRunning) {
            const oldPhase = phase;
            totalTime = getPhaseDuration();
            if (timeLeft > totalTime) timeLeft = totalTime;
            updateUI();
          }
        });
      });

      // extra: save stats on page unload
      window.addEventListener('beforeunload', function() {
        if (isRunning) {
          // save current focus seconds
          saveStats();
        }
      });
    }

    init();
  })();
</script>
