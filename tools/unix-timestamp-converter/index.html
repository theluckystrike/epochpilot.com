    <div class="container">
        <header>
            <h1>Unix Timestamp Converter</h1>
            <p class="subtitle">Convert between Unix timestamps and human-readable dates</p>
        </header>

        <div class="tool-section">
            <div class="live-timestamp">
                <div class="live-timestamp-label">Current Unix Timestamp</div>
                <div class="live-timestamp-value" id="liveTimestamp">0</div>

                <button class="tab-btn active" onclick="switchTab('timestamp-to-date')">Timestamp → Date</button>
                <button class="tab-btn" onclick="switchTab('date-to-timestamp')">Date → Timestamp</button>
            </div>

            <div id="timestamp-to-date" class="tab-content active">
                <div class="input-group">
                    <label for="timestampInput">Unix Timestamp (seconds or milliseconds)</label>

                </div>
                <div class="button-group">
                    <button onclick="convertTimestampToDate()">Convert</button>
                    <button class="button-secondary" onclick="useCurrentTimestamp()">Use Current</button>
                </div>
            </div>

                <div class="input-group">
                    <label for="dateInput">Date & Time</label>
                    <input type="datetime-local" id="dateInput" />
                </div>
                <div class="button-group">
                    <button onclick="convertDateToTimestamp()">Convert</button>
                    <button class="button-secondary" onclick="useNow()">Use Now</button>
                </div>
            </div>

    <script>
        // Update live timestamp every second
        function updateLiveTimestamp() {
            const now = Math.floor(Date.now() / 1000);
            document.getElementById('liveTimestamp').textContent = now;
        }
        setInterval(updateLiveTimestamp, 1000);
        updateLiveTimestamp();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function useCurrentTimestamp() {
            const now = Math.floor(Date.now() / 1000);
            document.getElementById('timestampInput').value = now;
            convertTimestampToDate();
        }

        function useNow() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('dateInput').value = `${year}-${month}-${day}T${hours}:${minutes}`;
            convertDateToTimestamp();
        }

        function convertTimestampToDate() {
            const input = document.getElementById('timestampInput').value.trim();
            if (!input) {
                showError('Please enter a timestamp');
                return;
            }

            let timestamp = parseInt(input, 10);
            if (isNaN(timestamp)) {
                showError('Invalid timestamp format');
                return;
            }

            // Auto-detect if milliseconds (13+ digits)
            if (input.length >= 13) {
                timestamp = Math.floor(timestamp / 1000);
            }

            try {
                const date = new Date(timestamp * 1000);
                if (isNaN(date.getTime())) {
                    showError('Invalid timestamp');
                    return;
                }

                const utcString = date.toUTCString();
                const iso8601 = date.toISOString();
                const localString = date.toString();
                const relativeTime = getRelativeTime(date);

                displayResults([
                    { label: 'Unix Timestamp', value: timestamp, copy: true },
                    { label: 'ISO 8601 (UTC)', value: iso8601, copy: true },
                    { label: 'UTC Date', value: utcString, copy: true },
                    { label: 'Local Time', value: localString, copy: true },
                    { label: 'Relative Time', value: relativeTime, copy: true }
                ]);
            } catch (e) {
                showError('Error converting timestamp');
            }
        }

        function convertDateToTimestamp() {
            const input = document.getElementById('dateInput').value;
            if (!input) {
                showError('Please select a date and time');
                return;
            }

            try {
                const date = new Date(input);
                const timestamp = Math.floor(date.getTime() / 1000);
                const timestampMs = date.getTime();

                const iso8601 = date.toISOString();
                const utcString = date.toUTCString();
                const relativeTime = getRelativeTime(date);

                displayResults([
                    { label: 'Unix Timestamp (seconds)', value: timestamp, copy: true },
                    { label: 'Unix Timestamp (milliseconds)', value: timestampMs, copy: true },
                    { label: 'ISO 8601', value: iso8601, copy: true },
                    { label: 'UTC Format', value: utcString, copy: true },
                    { label: 'Relative Time', value: relativeTime, copy: true }
                ]);
            } catch (e) {
                showError('Error converting date');
            }
        }

        function getRelativeTime(date) {
            const now = new Date();
            const diff = now - date;
            const absDiff = Math.abs(diff);

            const seconds = Math.floor(absDiff / 1000);
            const minutes = Math.floor(absDiff / 60000);
            const hours = Math.floor(absDiff / 3600000);
            const days = Math.floor(absDiff / 86400000);

            let result = '';
            if (days > 0) result = `${days} day${days !== 1 ? 's' : ''} `;
            else if (hours > 0) result = `${hours} hour${hours !== 1 ? 's' : ''} `;
            else if (minutes > 0) result = `${minutes} minute${minutes !== 1 ? 's' : ''} `;
            else result = `${seconds} second${seconds !== 1 ? 's' : ''} `;

            result += diff < 0 ? 'from now' : 'ago';
            return result;
        }

        function displayResults(results) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="result-label">${result.label}</div>
                    <div class="result-value">${result.value}</div>
                    ${result.copy ? `<button class="copy-btn" onclick="copyToClipboard('${result.value}')">Copy</button>` : ''}
                `;
                grid.appendChild(card);
            });

            document.getElementById('results').style.display = 'block';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showSuccess('Copied to clipboard!');
            });
        }

        function showError(message) {
            document.getElementById('results').style.display = 'none';
            const msg = document.querySelector('.error') || document.createElement('div');
            msg.className = 'error';
            msg.textContent = message;
            if (!msg.parentNode) {
                document.querySelector('.tab-content.active').appendChild(msg);
            }
            setTimeout(() => msg.remove(), 3000);
        }

        function showSuccess(message) {
            const msg = document.createElement('div');
            msg.className = 'success';
            msg.textContent = message;
            document.body.appendChild(msg);
            setTimeout(() => msg.remove(), 2000);
        }

        // Set default date input to now
        window.addEventListener('load', () => {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('dateInput').value = `${year}-${month}-${day}T${hours}:${minutes}`;
        });
    </script>
