        function getWorkWeekDays() {
            const workWeek = document.getElementById('workWeek').value;
            if (workWeek === 'mon-fri') return [1, 2, 3, 4, 5];
            if (workWeek === 'mon-sat') return [1, 2, 3, 4, 5, 6];
            if (workWeek === 'sun-thu') return [0, 1, 2, 3, 4];
            return [1, 2, 3, 4, 5];
        }

        function getCountryHolidays(year) {
            const country = document.getElementById('country').value;
            const countryHolidays = holidays[country] || {};
            return countryHolidays[year] || [];
        }

        function isBusinessDay(date) {
            const dayOfWeek = date.getDay();
            const workDays = getWorkWeekDays();
            const dateStr = date.toISOString().split('T')[0];
            const year = date.getFullYear();
            const countryHolidays = getCountryHolidays(year);

            return workDays.includes(dayOfWeek) && !countryHolidays.includes(dateStr);
        }

        function calculate() {
            const startStr = document.getElementById('startDate').value;
            const endStr = document.getElementById('endDate').value;

            if (!startStr || !endStr) return;

            const start = new Date(startStr + 'T00:00:00');
            const end = new Date(endStr + 'T00:00:00');

            if (start > end) {
                alert('Start date must be before end date');
                return;
            }

            let businessDays = 0;
            let weekendDays = 0;
            let holidayDays = 0;
            const monthData = {};

            const current = new Date(start);
            const workDays = getWorkWeekDays();

            while (current <= end) {
                const dateStr = current.toISOString().split('T')[0];
                const monthKey = dateStr.slice(0, 7);
                const year = current.getFullYear();
                const dayOfWeek = current.getDay();
                const countryHolidays = getCountryHolidays(year);

                if (!monthData[monthKey]) {
                    monthData[monthKey] = { business: 0, weekend: 0, holiday: 0 };
                }

                if (workDays.includes(dayOfWeek)) {
                    if (countryHolidays.includes(dateStr)) {
                        holidayDays++;
                        monthData[monthKey].holiday++;
                    } else {
                        businessDays++;
                        monthData[monthKey].business++;
                    }
                } else {
                    weekendDays++;
                    monthData[monthKey].weekend++;
                }

                current.setDate(current.getDate() + 1);
            }

            document.getElementById('businessDays').textContent = businessDays;
            document.getElementById('calendarDays').textContent = Math.ceil((end - start) / (1000 * 60 * 60 * 24)) + 1;
            document.getElementById('weekends').textContent = weekendDays;
            document.getElementById('holidays').textContent = holidayDays;

            // Monthly breakdown
            let table = '';
            Object.keys(monthData).sort().forEach(month => {
                const data = monthData[month];
                const [year, monthNum] = month.split('-');
                const monthName = new Date(year, monthNum - 1).toLocaleString('default', { month: 'long', year: 'numeric' });
                table += `<tr><td>${monthName}</td><td>${data.business}</td><td>${data.weekend}</td><td>${data.holiday}</td></tr>`;
            });

            document.getElementById('monthTable').innerHTML = table;
            document.getElementById('monthBreakdown').style.display = 'block';
        }

        function setPreset(type) {
            const today = new Date();
            let start, end;

            switch(type) {
                case 'quarter':
                    const quarter = Math.floor(today.getMonth() / 3);
                    start = new Date(today.getFullYear(), quarter * 3, 1);
                    end = new Date(today.getFullYear(), (quarter + 1) * 3, 0);
                    break;
                case 'year':
                    start = new Date(today.getFullYear(), 0, 1);
                    end = new Date(today.getFullYear(), 11, 31);
                    break;
                case '30':
                    start = new Date(today);
                    end = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000);
                    break;
                case '90':
                    start = new Date(today);
                    end = new Date(today.getTime() + 90 * 24 * 60 * 60 * 1000);
                    break;
            }

            document.getElementById('startDate').value = start.toISOString().split('T')[0];
            document.getElementById('endDate').value = end.toISOString().split('T')[0];
            calculate();
        }

        const today = new Date();
        document.getElementById('startDate').value = today.toISOString().split('T')[0];
        document.getElementById('endDate').value = new Date(today.getTime() + 30 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
