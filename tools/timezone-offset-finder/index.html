        function filterCities() {
            const input = document.getElementById('citySearch').value.toLowerCase();
            const list = document.getElementById('autocompleteList');

            if (input.length < 2) {
                list.classList.remove('active');
                return;
            }

            const filtered = TIMEZONES.filter(item =>
                item.city.toLowerCase().includes(input)
            ).slice(0, 15);

            if (filtered.length === 0) {
                list.classList.remove('active');
                return;
            }

            list.innerHTML = filtered.map((item, idx) =>
                `<div class="autocomplete-item" onclick="selectCity('${item.city}', '${item.tz}')">${item.city}</div>`
            ).join('');

            list.classList.add('active');
            selectedIndex = -1;
        }

        function selectCity(city, tz) {
            document.getElementById('citySearch').value = city;
            document.getElementById('autocompleteList').classList.remove('active');
            displayTimezoneInfo(city, tz);
        }

        function searchCity() {
            const input = document.getElementById('citySearch').value.trim();
            if (!input) return;

            const found = TIMEZONES.find(item => item.city.toLowerCase() === input.toLowerCase());
            if (found) {
                displayTimezoneInfo(found.city, found.tz);
            } else {
                showError('City not found. Please select from the list.');
            }
        }

        function useMyTimezone() {
            if (!userTimezone) {
                showError('Unable to detect your timezone');
                return;
            }

            const found = TIMEZONES.find(item => item.tz === userTimezone);
            if (found) {
                displayTimezoneInfo('Your Timezone: ' + found.city, userTimezone);
            } else {
                displayTimezoneInfo('Your Timezone', userTimezone);
            }
        }

        function displayTimezoneInfo(city, timezone) {
            try {
                const now = new Date();
                const formatter = new Intl.DateTimeFormat('en-US', {
                    timeZone: timezone,
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const parts = formatter.formatToParts(now);
                const localTime = parts.map(p => p.value).join('');

                // Calculate offset
                const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
                const tzDate = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
                const offset = (tzDate - utcDate) / (1000 * 60);
                const hours = Math.floor(Math.abs(offset) / 60);
                const minutes = Math.abs(offset) % 60;
                const sign = offset >= 0 ? '+' : '-';
                const offsetStr = `UTC${sign}${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;

                // Format local time properly
                const dateObj = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
                const timeString = dateObj.toLocaleTimeString('en-US', { timeZone: timezone });
                const dateString = dateObj.toLocaleDateString('en-US', { timeZone: timezone });

                const section = document.getElementById('resultsSection');
                section.innerHTML = `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="result-city">${city}</div>
                        </div>
                        <div class="result-grid">
                            <div class="result-item">
                                <div class="result-label">Current Time</div>
                                <div class="result-value">${timeString}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">Date</div>
                                <div class="result-value">${dateString}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">UTC Offset</div>
                                <div class="result-value">${offsetStr}</div>
                            </div>
                            <div class="result-item">
                                <div class="result-label">Timezone ID</div>
                                <div class="result-value" style="font-size: 0.9em;">${timezone}</div>
                            </div>
                        </div>
                    </div>
                `;
                section.style.display = 'block';

            } catch (e) {
                showError('Error processing timezone: ' + e.message);
            }
        }

        function showError(message) {
            const section = document.getElementById('resultsSection');
            section.innerHTML = `<div class="error">${message}</div>`;
            section.style.display = 'block';
        }
