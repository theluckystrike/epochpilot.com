<body>
    <div class="container">
        <header>
            <h1>Duration Formatter</h1>
            <p class="subtitle">Convert between all duration formats</p>
        </header>

        <div class="tool-section">
            <div class="info-box">
                Enter duration in any format and see conversions to all other formats simultaneously.
            </div>

            <div class="input-grid">
                <div class="input-group">
                    <label for="seconds">Seconds</label>
                    <input type="number" id="seconds" placeholder="0" step="0.01" oninput="convertFromField('seconds')" />
                </div>
                <div class="input-group">
                    <label for="minutes">Minutes</label>
                    <input type="number" id="minutes" placeholder="0" step="0.01" oninput="convertFromField('minutes')" />
                </div>
                <div class="input-group">
                    <label for="hours">Hours</label>
                    <input type="number" id="hours" placeholder="0" step="0.01" oninput="convertFromField('hours')" />
                </div>
                <div class="input-group">
                    <label for="days">Days</label>
                    <input type="number" id="days" placeholder="0" step="0.001" oninput="convertFromField('days')" />
                </div>
                <div class="input-group">
                    <label for="iso8601">ISO 8601</label>
                    <input type="text" id="iso8601" placeholder="PT2H30M" oninput="convertFromField('iso8601')" />
                </div>
                <div class="input-group">
                    <label for="humanReadable">Human Readable</label>
                    <input type="text" id="humanReadable" placeholder="2h 30m" oninput="convertFromField('humanReadable')" />
                </div>
            </div>

            <div class="preset-buttons">
                <button class="preset-btn" onclick="setPreset(1)">1 minute</button>
                <button class="preset-btn" onclick="setPreset(5)">5 minutes</button>
                <button class="preset-btn" onclick="setPreset(3600)">1 hour</button>
                <button class="preset-btn" onclick="setPreset(28800)">8 hours</button>
                <button class="preset-btn" onclick="setPreset(86400)">1 day</button>
                <button class="preset-btn" onclick="setPreset(604800)">1 week</button>
            </div>

            <div class="button-group">
                <button class="button-secondary" onclick="clearAll()">Clear All</button>
            </div>

            <div id="results" style="display: none;">
                <div class="results-grid" id="resultsGrid"></div>
            </div>
        </div>

        <footer>© 2026 epochpilot.com — Time & Date Tools</footer>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Duration Formatter",
        "description": "Convert between all duration formats: seconds, minutes, hours, days, and ISO 8601",
        "url": "https://epochpilot.com/tools/duration-formatter",
        "applicationCategory": "UtilityApplication",
        "offers": {

    <script>
        let ignoreChange = false;

        function convertFromField(field) {
            if (ignoreChange) return;

            let totalSeconds = 0;

            switch(field) {
                case 'seconds':
                    totalSeconds = parseFloat(document.getElementById('seconds').value) || 0;
                    break;
                case 'minutes':
                    totalSeconds = (parseFloat(document.getElementById('minutes').value) || 0) * 60;
                    break;
                case 'hours':
                    totalSeconds = (parseFloat(document.getElementById('hours').value) || 0) * 3600;
                    break;
                case 'days':
                    totalSeconds = (parseFloat(document.getElementById('days').value) || 0) * 86400;
                    break;
                case 'iso8601':
                    totalSeconds = parseISO8601(document.getElementById('iso8601').value);
                    break;
                case 'humanReadable':
                    totalSeconds = parseHumanReadable(document.getElementById('humanReadable').value);
                    break;
            }

            if (totalSeconds >= 0) {
                updateAllFields(totalSeconds);
                displayResults(totalSeconds);
            }
        }

        function parseISO8601(str) {
            if (!str) return 0;
            const regex = /^PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+(?:\.\d+)?)S)?$/;
            const match = str.match(regex);
            if (!match) return 0;

            const hours = (parseInt(match[1]) || 0) * 3600;
            const minutes = (parseInt(match[2]) || 0) * 60;
            const seconds = parseFloat(match[3]) || 0;

            return hours + minutes + seconds;
        }

        function parseHumanReadable(str) {
            if (!str) return 0;
            let total = 0;
            const regex = /(\d+(?:\.\d+)?)\s*([smhd])/gi;
            let match;

            while ((match = regex.exec(str)) !== null) {
                const value = parseFloat(match[1]);
                const unit = match[2].toLowerCase();

                switch(unit) {
                    case 's': total += value; break;
                    case 'm': total += value * 60; break;
                    case 'h': total += value * 3600; break;
                    case 'd': total += value * 86400; break;
                }
            }

            return total;
        }

        function updateAllFields(totalSeconds) {
            ignoreChange = true;

            document.getElementById('seconds').value = totalSeconds.toFixed(2);
            document.getElementById('minutes').value = (totalSeconds / 60).toFixed(4);
            document.getElementById('hours').value = (totalSeconds / 3600).toFixed(6);
            document.getElementById('days').value = (totalSeconds / 86400).toFixed(8);
            document.getElementById('iso8601').value = formatISO8601(totalSeconds);
            document.getElementById('humanReadable').value = formatHumanReadable(totalSeconds);

            ignoreChange = false;
        }

        function formatISO8601(seconds) {
            let remaining = Math.round(seconds);
            const hours = Math.floor(remaining / 3600);
            remaining %= 3600;
            const minutes = Math.floor(remaining / 60);
            remaining %= 60;
            const secs = remaining;

            let result = 'PT';
            if (hours > 0) result += hours + 'H';
            if (minutes > 0) result += minutes + 'M';
            if (secs > 0 || result === 'PT') result += secs + 'S';

            return result;
        }

        function formatHumanReadable(seconds) {
            const days = Math.floor(seconds / 86400);
            let remaining = seconds % 86400;
            const hours = Math.floor(remaining / 3600);
            remaining %= 3600;
            const minutes = Math.floor(remaining / 60);
            const secs = Math.round(remaining % 60);

            let parts = [];
            if (days > 0) parts.push(days + 'd');
            if (hours > 0) parts.push(hours + 'h');
            if (minutes > 0) parts.push(minutes + 'm');
            if (secs > 0) parts.push(secs + 's');

            return parts.length > 0 ? parts.join(' ') : '0s';
        }

        function displayResults(totalSeconds) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            const results = [
                { label: 'Seconds', value: totalSeconds.toFixed(2) },
                { label: 'Minutes', value: (totalSeconds / 60).toFixed(4) },
                { label: 'Hours', value: (totalSeconds / 3600).toFixed(6) },
                { label: 'Days', value: (totalSeconds / 86400).toFixed(8) },
                { label: 'ISO 8601', value: formatISO8601(totalSeconds) },
                { label: 'Human Readable', value: formatHumanReadable(totalSeconds) }
            ];

            results.forEach(result => {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.innerHTML = `
                    <div class="result-label">${result.label}</div>
                    <div class="result-value">${result.value}</div>
                    <button class="copy-btn" onclick="copyToClipboard('${result.value}')">Copy</button>
                `;
                grid.appendChild(card);
            });

            document.getElementById('results').style.display = 'block';
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                const msg = document.createElement('div');
                msg.textContent = 'Copied!';
                msg.style.cssText = 'position:fixed;top:20px;right:20px;background:#51cf66;color:#1a1a2e;padding:10px 20px;border-radius:6px;z-index:1000;';
                document.body.appendChild(msg);
                setTimeout(() => msg.remove(), 2000);
            });
        }

        function setPreset(seconds) {
            updateAllFields(seconds);
            displayResults(seconds);
        }

        function clearAll() {
            document.getElementById('seconds').value = '';
            document.getElementById('minutes').value = '';
            document.getElementById('hours').value = '';
            document.getElementById('days').value = '';
            document.getElementById('iso8601').value = '';
            document.getElementById('humanReadable').value = '';
            document.getElementById('results').style.display = 'none';
        }
    </script>
</body>
