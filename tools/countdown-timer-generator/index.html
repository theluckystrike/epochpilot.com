<body>
    <div class="container">
        <h1>Countdown Timer Generator</h1>
        <p class="subtitle">Create embeddable countdown timers to any future date</p>

        <div class="main-grid">
            <div class="section">
                <div class="form-group">
                    <label for="eventTitle">Event Title</label>
                    <input type="text" id="eventTitle" placeholder="e.g., New Year 2027">
                </div>

                <div class="form-group">
                    <label for="targetDateTime">Target Date & Time</label>
                    <input type="datetime-local" id="targetDateTime">
                </div>

                <div class="form-group">
                    <label for="timerStyle">Timer Style</label>
                    <select id="timerStyle" onchange="updatePreview()">
                        <option value="flip">Flip Clock</option>
                        <option value="digital">Digital</option>
                        <option value="minimal">Minimal</option>
                        <option value="circle">Circle Progress</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="colorScheme">Color Scheme</label>
                    <select id="colorScheme" onchange="updateColorOptions()">
                        <option value="blue">Blue</option>
                        <option value="green">Green</option>
                        <option value="purple">Purple</option>
                        <option value="orange">Orange</option>
                        <option value="red">Red</option>
                    </select>
                    <div class="color-grid" id="colorGrid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="finishMessage">Finish Message</label>
                    <input type="text" id="finishMessage" placeholder="Event Started!">
                </div>

                <button class="button" onclick="updatePreview()">Generate Preview</button>

                <div class="preset-buttons">
                    <button class="preset-btn" onclick="setNewYear()">New Year 2027</button>
                    <button class="preset-btn" onclick="setNextChristmas()">Next Christmas</button>
                    <button class="preset-btn" onclick="set100Days()">100 Days</button>
                    <button class="preset-btn" onclick="setNextMonth()">Next Month</button>
                </div>
            </div>

            <div class="section">
                <h3 style="margin-bottom: 20px; color: #3b82f6;">Preview</h3>
                <div class="preview-section" id="preview">
                    <!-- Timer preview shown here -->
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
                </div>

                <div class="embed-section">
                    <div class="embed-label">Embeddable HTML Code</div>
                    <div class="embed-code" id="embedCode">Click Generate to create code</div>
                    <button class="copy-btn" onclick="copyEmbedCode()">Copy Code</button>
                </div>
            </div>
        </div>

    <script>
        const colors = {
            blue: '#3b82f6',
            green: '#10b981',
            purple: '#a855f7',
            orange: '#f97316',
            red: '#ef4444'
        };

        function updateColorOptions() {
            const scheme = document.getElementById('colorScheme').value;
            const grid = document.getElementById('colorGrid');
            grid.innerHTML = '';

            // Create color swatches
            Object.keys(colors).forEach(key => {
                const swatch = document.createElement('div');
                swatch.className = 'color-option' + (key === scheme ? ' selected' : '');
                swatch.style.backgroundColor = colors[key];
                swatch.onclick = () => selectColor(key);
                grid.appendChild(swatch);
            });
        }

        function selectColor(color) {
            document.getElementById('colorScheme').value = color;
            updateColorOptions();
            updatePreview();
        }

        function getTargetDate() {
            const dateTimeStr = document.getElementById('targetDateTime').value;
            if (!dateTimeStr) return new Date();
            return new Date(dateTimeStr + ':00Z');
        }

        function updateProgress() {
            const target = getTargetDate();
            const now = new Date();
            const total = (target - new Date('2000-01-01')) / (1000 * 60 * 60 * 24);
            const remaining = (target - now) / (1000 * 60 * 60 * 24);

            if (remaining <= 0) {
                document.getElementById('progressFill').style.width = '100%';
            } else {
                const percent = Math.max(0, Math.min(100, ((total - remaining) / total) * 100));
                document.getElementById('progressFill').style.width = percent + '%';
            }
        }

        function getCountdownValues() {
            const target = getTargetDate();
            const now = new Date();
            const diff = target - now;

            if (diff <= 0) {
                return { days: 0, hours: 0, minutes: 0, seconds: 0, finished: true };
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            return { days, hours, minutes, seconds, finished: false };
        }

        function createFlipClock() {
            const { days, hours, minutes, seconds, finished } = getCountdownValues();

            if (finished) {
                return `<div style="text-align: center; font-size: 1.5rem; color: #3b82f6;">${document.getElementById('finishMessage').value || 'Event Started!'}</div>`;
            }

            return `
                <div class="flip-clock">
                    <div class="flip-item">
                        <span class="flip-number">${String(days).padStart(2, '0')}</span>
                        <span class="flip-label">Days</span>
                    </div>
                    <div class="flip-item">
                        <span class="flip-number">${String(hours).padStart(2, '0')}</span>
                        <span class="flip-label">Hours</span>
                    </div>
                    <div class="flip-item">
                        <span class="flip-number">${String(minutes).padStart(2, '0')}</span>
                        <span class="flip-label">Mins</span>
                    </div>
                    <div class="flip-item">
                        <span class="flip-number">${String(seconds).padStart(2, '0')}</span>
                        <span class="flip-label">Secs</span>
                    </div>
                </div>
            `;
        }

        function createDigitalTimer() {
            const { days, hours, minutes, seconds, finished } = getCountdownValues();

            if (finished) {
                return `<div style="text-align: center; font-size: 1.5rem; color: #3b82f6;">${document.getElementById('finishMessage').value || 'Event Started!'}</div>`;
            }

            return `
                <div class="digital-timer">
                    ${String(days).padStart(2, '0')}:${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}
                </div>
                <div style="text-align: center; color: #999; margin-top: 10px; font-size: 0.9rem;">Days:Hours:Minutes:Seconds</div>
            `;
        }

        function createMinimalTimer() {
            const { days, hours, minutes, seconds, finished } = getCountdownValues();

            if (finished) {
                return `<div style="text-align: center; font-size: 1.2rem; color: #3b82f6;">${document.getElementById('finishMessage').value || 'Event Started!'}</div>`;
            }

            return `
                <div class="minimal-timer">
                    <div>${days} days, ${hours} hours, ${minutes} mins, ${seconds} secs</div>
                </div>
            `;
        }

        function createCircleTimer() {
            const { finished } = getCountdownValues();
            const target = getTargetDate();
            const now = new Date();
            const startTime = new Date('2000-01-01');
            const totalMs = target - startTime;
            const elapsedMs = now - startTime;
            const progress = Math.min(100, (elapsedMs / totalMs) * 100);

            const { days, hours, minutes, seconds } = getCountdownValues();

            if (finished) {
                return `
                    <div class="circle-timer" style="--progress: 360deg;">
                        <div class="circle-timer-inner">
                            <div style="text-align: center; color: #3b82f6; font-size: 1.2rem; font-weight: bold;">
                                ${document.getElementById('finishMessage').value || 'Event Started!'}
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="circle-timer" style="--progress: ${(progress / 100) * 360}deg;">
                    <div class="circle-timer-inner">
                        <div style="text-align: center;">
                            <div style="font-size: 0.9rem; color: #999; margin-bottom: 10px;">Days</div>
                            <div class="circle-timer-text">${days}</div>
                            <div style="font-size: 0.75rem; color: #666; margin-top: 10px;">${hours}h ${minutes}m</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function updatePreview() {
            const style = document.getElementById('timerStyle').value;
            let html = '';

            if (style === 'flip') {
                html = createFlipClock();
            } else if (style === 'digital') {
                html = createDigitalTimer();
            } else if (style === 'minimal') {
                html = createMinimalTimer();
            } else if (style === 'circle') {
                html = createCircleTimer();
            }

            document.getElementById('preview').innerHTML = html;
            updateProgress();
            generateEmbedCode();
        }

        function generateEmbedCode() {
            const title = document.getElementById('eventTitle').value || 'Countdown';
            const style = document.getElementById('timerStyle').value;
            const colorScheme = document.getElementById('colorScheme').value;
            const color = colors[colorScheme];
            const dateTime = document.getElementById('targetDateTime').value;

            const code = `<iframe src="https://epochpilot.com/tools/countdown-timer-generator?target=${dateTime}&style=${style}&color=${encodeURIComponent(color)}&title=${encodeURIComponent(title)}" width="500" height="300" frameborder="0" style="border: none; border-radius: 8px;"></iframe>`;

            document.getElementById('embedCode').textContent = code;
        }

        function copyEmbedCode() {
            const code = document.getElementById('embedCode').textContent;
            navigator.clipboard.writeText(code).then(() => {
                alert('Code copied to clipboard!');
            });
        }

        // Preset functions
        function setNewYear() {
            const today = new Date();
            const nextYear = today.getFullYear() + 1;
            const newYear = new Date(nextYear, 0, 1, 0, 0);
            document.getElementById('eventTitle').value = 'New Year ' + nextYear;
            document.getElementById('targetDateTime').value = newYear.toISOString().slice(0, 16);
            updatePreview();
        }

        function setNextChristmas() {
            const today = new Date();
            let christmas = new Date(today.getFullYear(), 11, 25);
            if (christmas < today) {
                christmas = new Date(today.getFullYear() + 1, 11, 25);
            }
            document.getElementById('eventTitle').value = 'Christmas ' + christmas.getFullYear();
            document.getElementById('targetDateTime').value = christmas.toISOString().slice(0, 16);
            updatePreview();
        }

        function set100Days() {
            const today = new Date();
            const target = new Date(today.getTime() + 100 * 24 * 60 * 60 * 1000);
            document.getElementById('eventTitle').value = '100 Days';
            document.getElementById('targetDateTime').value = target.toISOString().slice(0, 16);
            updatePreview();
        }

        function setNextMonth() {
            const today = new Date();
            const nextMonth = new Date(today.getFullYear(), today.getMonth() + 1, 1);
            document.getElementById('eventTitle').value = 'Next Month';
            document.getElementById('targetDateTime').value = nextMonth.toISOString().slice(0, 16);
            updatePreview();
        }

        // Initialize
        const futureDate = new Date();
        futureDate.setDate(futureDate.getDate() + 30);
        document.getElementById('targetDateTime').value = futureDate.toISOString().slice(0, 16);
        document.getElementById('eventTitle').value = 'Upcoming Event';
        document.getElementById('finishMessage').value = 'Event Started!';

        updateColorOptions();
        updatePreview();

        // Update countdown every second
        setInterval(updatePreview, 1000);
    </script>
